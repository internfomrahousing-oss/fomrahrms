name: fomra_hrms
description: FOMRA Housing and Infrastructure HRMS Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  go_router: ^13.0.0
  flutter_svg: ^2.0.9
  geolocator: ^13.0.0
  http: ^1.2.0
  shared_preferences: ^2.3.0
  image_picker: ^1.1.2
  supabase_flutter: ^2.3.0
  google_fonts: ^6.2.1
  pdf: ^3.11.1
  printing: ^5.13.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  flutter_image_compress: ^2.3.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  device_info_plus: ^11.2.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
