<!DOCTYPE html>
<html>
<head>
  <base href="./">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FOMRA Housing and Infrastructure HRMS">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FOMRA HRMS">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>FOMRA HRMS</title>
  <style>
    body {
      margin: 0;
      background-color: #0D47A1;
    }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #0D47A1;
      color: white;
      font-family: 'Segoe UI', sans-serif;
    }
    #loading .logo { font-size: 2rem; font-weight: 700; letter-spacing: 4px; margin-bottom: 8px; }
    #loading .sub  { font-size: 0.85rem; color: rgba(255,255,255,0.7); margin-bottom: 32px; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo">FOMRA</div>
    <div class="sub">Housing &amp; Infrastructure HRMS</div>
    <div class="spinner"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      document.getElementById('loading').remove();
    });
  </script>
  <script src="bundle.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
